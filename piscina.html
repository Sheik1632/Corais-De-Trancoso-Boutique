  <style>
    :root{
      --brand:#007bff; --bg:#f5f5f5; --card:#fff; --ink:#333;
      --radius:12px; --shadow:0 8px 20px rgba(0,0,0,.12);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    *,*::before,*::after{ box-sizing:border-box; }
    html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
    body{
      margin:0; font-family:"Quicksand", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:var(--bg); color:var(--ink); line-height:1.6;
    }
    :focus-visible{ outline:3px solid #93c5fd; outline-offset:3px; }

    h1{
      text-align:center; padding:calc(16px + var(--safe-top)) 12px 12px;
      font-size:clamp(1.6rem, 1.8vw + 1rem, 2.4rem); color:var(--brand); margin:0;
    }

    /* GRID */
    .gallery{
      display:grid; gap:16px;
      grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
      max-width:1200px; margin:0 auto; padding:20px;
    }
    .gallery picture{ display:block; content-visibility:auto; contain-intrinsic-size:320px 240px; }
    .gallery img{
      width:100%; aspect-ratio:4/3; object-fit:cover;
      border-radius:var(--radius); cursor:pointer; background:#e9eef3;
      box-shadow:var(--shadow);
      transition:transform .25s ease, box-shadow .25s ease, opacity .25s ease;
      opacity:0;
    }
    .gallery img.loaded{ opacity:1; }
    .gallery img:hover{ transform:scale(1.03); box-shadow:0 14px 28px rgba(0,0,0,.18); }

    /* BOTÃO VOLTAR */
    .back-btn{
      display:block; max-width:max-content; margin:6px auto 40px;
      padding:12px 20px; background:var(--brand); color:#fff; text-decoration:none;
      border-radius:999px; font-weight:700; transition:background .25s, transform .2s;
      min-height:44px;
      padding-bottom: calc(12px + var(--safe-bottom));
    }
    .back-btn:hover{ background:#0056b3; transform:translateY(-2px); }

    /* LIGHTBOX */
    .lightbox{
      position:fixed; inset:0; display:none; align-items:center; justify-content:center;
      background:rgba(0,0,0,.85); z-index:1000;
      padding: max(8px, var(--safe-top)) 8px max(8px, var(--safe-bottom));
    }
    .lightbox.open{ display:flex; }
    .lightbox img{
      max-width:min(92vw, 1400px); max-height:90vh;
      border-radius:var(--radius); box-shadow:var(--shadow);
      background:#111;
    }
    .lb-close, .lb-arrow{
      position:absolute; display:grid; place-items:center; border:0; cursor:pointer;
      width:46px; height:46px; border-radius:50%; color:#fff; background:rgba(0,0,0,.5);
      transition:background .2s ease, transform .2s ease; -webkit-tap-highlight-color:transparent;
    }
    .lb-close{ top:18px; right:18px; font-size:1.1rem; }
    .lb-arrow{ top:50%; transform:translateY(-50%); font-size:1.2rem; }
    .lb-prev{ left:16px; }
    .lb-next{ right:16px; }
    .lb-close:hover, .lb-arrow:hover{ background:rgba(0,0,0,.7); transform:translateY(-50%) scale(1.05); }
    .lb-close:hover{ transform:none; }

    .visually-hidden{
      position:absolute; width:1px; height:1px; margin:-1px; padding:0; border:0;
      clip:rect(0 0 0 0); overflow:hidden; white-space:nowrap;
    }

    @media (max-width: 600px){
      .gallery{ gap:12px; padding:12px; }
      .back-btn{ padding:10px 16px; font-size:.95rem; }
      .lb-arrow{ width:42px; height:42px; }
    }
    @media (prefers-reduced-motion: reduce){
      *{ animation:none!important; transition:none!important; scroll-behavior:auto!important; }
    }

  <!-- Lightbox com setas -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lb-title">
    <span id="lb-title" class="visually-hidden">Foto ampliada</span>
    <button class="lb-close" aria-label="Fechar">✕</button>
    <button class="lb-arrow lb-prev" aria-label="Anterior">❮</button>
    <img src="" alt="">
    <button class="lb-arrow lb-next" aria-label="Próxima">❯</button>
  </div>

  <script>
    (function (){
      const nodes = Array.from(document.querySelectorAll('#galeria picture'));
      const imgs  = nodes.map(n => n.querySelector('img'));
      const box   = document.getElementById('lightbox');
      const lbImg = box.querySelector('img');
      const btnPrev = box.querySelector('.lb-prev');
      const btnNext = box.querySelector('.lb-next');
      const btnClose= box.querySelector('.lb-close');
      let idx = -1;

      // Fade-in quando cada img carregar
      imgs.forEach(img => {
        if (img.complete) img.classList.add('loaded');
        else img.addEventListener('load', ()=> img.classList.add('loaded'), {once:true});
      });

      function setLB(src, alt){
        lbImg.src = src;
        lbImg.alt = alt || 'Foto ampliada da piscina';
        // Preload da próxima imagem
        const nextIdx = (idx + 1) % imgs.length;
        const link = document.createElement('link');
        link.rel = 'preload'; link.as = 'image';
        link.href = imgs[nextIdx].currentSrc || imgs[nextIdx].src;
        document.head.appendChild(link);
      }

      function openAt(i){
        idx = i;
        setLB(imgs[idx].currentSrc || imgs[idx].src, imgs[idx].alt);
        box.classList.add('open');
      }
      function closeBox(){
        box.classList.remove('open');
        lbImg.src = '';
        idx = -1;
      }
      function prev(){
        idx = (idx - 1 + imgs.length) % imgs.length;
        setLB(imgs[idx].currentSrc || imgs[idx].src, imgs[idx].alt);
      }
      function next(){
        idx = (idx + 1) % imgs.length;
        setLB(imgs[idx].currentSrc || imgs[idx].src, imgs[idx].alt);
      }

      // Abrir pelo clique
      nodes.forEach((wrap, i) => wrap.addEventListener('click', () => openAt(i)));

      // Controles
      btnClose.addEventListener('click', closeBox);
      btnPrev.addEventListener('click', prev);
      btnNext.addEventListener('click', next);

      // Fechar clicando fora da imagem
      box.addEventListener('click', (e)=>{ if(e.target === box) closeBox(); });

      // Teclado
      window.addEventListener('keydown', (e)=>{
        if(!box.classList.contains('open')) return;
        if(e.key === 'Escape') closeBox();
        if(e.key === 'ArrowLeft') prev();
        if(e.key === 'ArrowRight') next();
      });

      // Swipe no lightbox (mobile)
      let startX = 0, swiping = false;
      box.addEventListener('touchstart', (e)=>{ startX = e.touches[0].clientX; swiping = true; }, {passive:true});
      box.addEventListener('touchmove', (e)=>{
        if(!swiping) return;
        const dx = e.touches[0].clientX - startX;
        if(Math.abs(dx) > 50){ swiping = false; dx < 0 ? next() : prev(); }
      }, {passive:true});
      box.addEventListener('touchend', ()=>{ swiping = false; });
    })();
  </script>

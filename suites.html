<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2b6cb0" />
<title>Galeria de Suítes - Pousada</title>

<!-- FAVICON -->
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
<link rel="shortcut icon" href="/images/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">

<!-- Fontes -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />

<!-- Font Awesome (não-bloqueante) -->
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>

<!-- Preload da primeira imagem principal (melhora LCP) -->
<link rel="preload" as="image"
      href="images/SUITES/Imagens/Mar%C3%A9%20alta/mare%20alta%201.jpg?nf_resize=fit&w=980&q=75"
      imagesrcset="
        images/SUITES/Imagens/Mar%C3%A9%20alta/mare%20alta%201.jpg?nf_resize=fit&w=800&q=75 800w,
        images/SUITES/Imagens/Mar%C3%A9%20alta/mare%20alta%201.jpg?nf_resize=fit&w=980&q=75 980w,
        images/SUITES/Imagens/Mar%C3%A9%20alta/mare%20alta%201.jpg?nf_resize=fit&w=1400&q=75 1400w"
      imagesizes="(max-width: 980px) 100vw, 980px">

<style>
  :root{
    --brand:#2b6cb0; --brand-2:#3498db; --bg:#f5f5f5; --card:#fff; --ink:#333;
    --radius:14px; --shadow:0 10px 24px rgba(0,0,0,.08);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; color-scheme: light; }
  body{
    margin:0; font-family:'Quicksand',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  }
  img{ max-width:100%; display:block; height:auto; }
  button{ font-family:inherit; }
  :focus-visible{ outline:3px solid #93c5fd; outline-offset:3px; }

  .section{ max-width:1200px; margin:40px auto; padding:0 16px; }
  h2{
    text-align:center; font-size:clamp(1.6rem, 2.2vw + 1rem, 2.4rem);
    color:var(--brand); margin:calc(8px + var(--safe-top)) 0 20px;
  }

  /* MENU DE CATEGORIAS */
  .categoria-menu{
    display:flex; flex-wrap:wrap; justify-content:center; gap:.5rem; margin:0 auto 22px;
    position:sticky; top:0; z-index:5; padding:10px 6px;
    backdrop-filter:saturate(120%) blur(6px);
    background:#ffffffd9; border-radius:12px;
  }
  .categoria-menu button{
    background:var(--brand-2); border:0; color:#fff; padding:10px 16px;
    border-radius:999px; cursor:pointer; font-weight:700; display:flex; align-items:center; gap:8px;
    transition:transform .2s ease, background-color .25s ease; white-space:nowrap; min-height:44px;
  }
  .categoria-menu button:hover{ transform:translateY(-2px); }
  .categoria-menu button.active{ background:var(--brand); }

  /* IMAGEM PRINCIPAL (16:9) */
  .main-image-container{
    position:relative; margin:0 auto 12px; max-width:980px; aspect-ratio:16/9;
    border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);
    background:#e9eef3;
  }
  #mainPicture, #mainPicture picture, #mainPicture img{ width:100%; height:100%; }
  #mainPicture picture{ display:block; }
  #mainPicture img{
    object-fit:cover; cursor:pointer; opacity:0; transition:opacity .25s ease, transform .25s ease;
  }
  #mainPicture img.loaded{ opacity:1; }
  #mainPicture img:hover{ transform:scale(1.02); }

  /* SETAS */
  .nav-arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    width:44px; height:44px; display:grid; place-items:center;
    border-radius:50%; color:#fff; background:rgba(0,0,0,.45);
    user-select:none; cursor:pointer; border:0; font-size:1.3rem;
    transition:background .25s ease, transform .2s ease, opacity .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .nav-arrow:hover{ background:rgba(0,0,0,.65); transform:translateY(-50%) scale(1.05); }
  .nav-left{ left:12px; } .nav-right{ right:12px; }
  .nav-arrow[disabled]{ opacity:.4; cursor:not-allowed; }

  #mainTitle{
    text-align:center; margin:8px 0 6px; font-weight:700; font-size:clamp(1rem, .9vw + .8rem, 1.15rem);
  }

  /* MINIATURAS */
  .galeria{
    display:grid; gap:16px;
    grid-template-columns:repeat(auto-fit, minmax(160px,1fr));
    align-items:stretch;
  }
  .item{
    background:var(--card); padding:10px; border-radius:12px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; text-align:center;
    transition:transform .2s ease, box-shadow .25s ease; cursor:pointer;
    content-visibility:auto; contain-intrinsic-size:220px 180px;
  }
  .item:hover{ transform:translateY(-4px); box-shadow:0 14px 28px rgba(0,0,0,.15); }
  .item picture{ width:100%; display:block; }
  .item img{ width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:10px; margin-bottom:8px; background:#eef2f7; }
  .item p{ margin:0; font-weight:700; display:flex; align-items:center; gap:8px; font-size:.95rem; }

  /* LIGHTBOX */
  .lightbox{
    position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:1000;
    padding: max(8px, var(--safe-top)) 8px max(8px, var(--safe-bottom));
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:min(92vw,1400px); max-height:88vh; border-radius:12px; }

  /* WHATSAPP */
  .whatsapp-btn{
    position:fixed; right:16px; bottom:16px; z-index:1001;
    background:#25d366; color:#fff; border-radius:999px; padding:12px 18px; font-weight:700;
    display:flex; align-items:center; gap:10px; text-decoration:none; box-shadow:0 8px 20px rgba(0,0,0,.2);
    transition:transform .2s ease, background .25s ease; min-height:44px;
    padding-bottom: calc(12px + var(--safe-bottom));
  }
  .whatsapp-btn:hover{ background:#1fb85b; transform:translateY(-2px); }
  .whatsapp-btn i{ font-size:1.25rem; }

  /* RESPONSIVIDADE / ACESSO */
  @media (max-width: 900px){
    .categoria-menu{ border-radius:10px; gap:.4rem; padding:8px; }
    .categoria-menu button{ padding:9px 14px; font-size:.95rem; }
  }
  @media (max-width: 640px){
    .section{ margin:22px auto; }
    .categoria-menu{ overflow:auto; -webkit-overflow-scrolling:touch; }
    .categoria-menu::-webkit-scrollbar{ height:6px; }
    .categoria-menu::-webkit-scrollbar-thumb{ background:#cbd5e1; border-radius:999px; }
    .nav-arrow{ width:40px; height:40px; font-size:1.1rem; }
    .galeria{ gap:12px; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); }
    .item{ padding:8px; }
    .whatsapp-btn{ bottom:14px; right:14px; padding:11px 16px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none!important; transition:none!important; scroll-behavior:auto!important; }
  }
</style>
</head>
<body>

<section class="section" aria-label="Galeria de Suítes">
  <h2>Suítes da Pousada</h2>

  <!-- Menu de Categorias -->
  <nav class="categoria-menu" aria-label="Filtrar por categoria">
    <button class="active" data-cat="todas" type="button"><i class="fa-solid fa-layer-group" aria-hidden="true"></i> <span>Todas</span></button>
    <button data-cat="mare-alta" type="button"><i class="fa-solid fa-bed" aria-hidden="true"></i> <span>Maré Alta</span></button>
    <button data-cat="jardim" type="button"><i class="fa-solid fa-leaf" aria-hidden="true"></i> <span>Jardim</span></button>
    <button data-cat="brisa" type="button"><i class="fa-solid fa-wind" aria-hidden="true"></i> <span>Brisa</span></button>
    <button data-cat="horizonte" type="button"><i class="fa-solid fa-mountain" aria-hidden="true"></i> <span>Horizonte</span></button>
    <button data-cat="master-raizes" type="button"><i class="fa-solid fa-tree" aria-hidden="true"></i> <span>Master Raízes</span></button>
    <button data-cat="master-oceano" type="button"><i class="fa-solid fa-water" aria-hidden="true"></i> <span>Master Oceano</span></button>
    <button data-cat="varanda-do-sol" type="button"><i class="fa-solid fa-sun" aria-hidden="true"></i> <span>Varanda do Sol</span></button>
  </nav>

  <!-- Imagem Principal 16:9 -->
  <div class="main-image-container">
    <button class="nav-arrow nav-left" id="prev" aria-label="Imagem anterior" type="button"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
    <div id="mainPicture" aria-hidden="false"></div>
    <button class="nav-arrow nav-right" id="next" aria-label="Próxima imagem" type="button"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
  </div>
  <p id="mainTitle" aria-live="polite"><i class="fa-solid fa-bed" aria-hidden="true"></i> SUÍTE MARÉ ALTA</p>

  <!-- Miniaturas -->
  <div class="galeria" id="galeria"></div>
</section>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visualização da imagem em tela cheia">
  <img src="" alt="Imagem ampliada da suíte" decoding="async" />
</div>

<!-- WhatsApp -->
<a class="whatsapp-btn" href="https://wa.me/557398678158?text=Ol%C3%A1!%20Gostaria%20de%20fazer%20uma%20reserva." target="_blank" rel="noopener">
  <i class="fa-brands fa-whatsapp" aria-hidden="true"></i> Reservar agora
</a>

<script>
/* ================== DADOS ================== */
const suites = {
  "mare-alta":[
    {src:"images/SUITES/Imagens/Maré alta/mare alta 1.jpg", icon:"fa-bed"},
    {src:"images/SUITES/Imagens/Maré alta/mare alta 2.jpg", icon:"fa-bed"},
    {src:"images/SUITES/Imagens/Maré alta/mare alta 3.jpg", icon:"fa-bed"},
    {src:"images/SUITES/Imagens/Maré alta/mare alta 4.jpg", icon:"fa-bed"},
    {src:"images/SUITES/Imagens/Maré alta/mare alta 5.jpg", icon:"fa-bed"}
  ],
  "jardim":[
    {src:"images/SUITES/Imagens/Jardim/jardim 2.jpg", icon:"fa-leaf"},
    {src:"images/SUITES/Imagens/Jardim/jardim.jpg", icon:"fa-leaf"},
    {src:"images/SUITES/Imagens/Jardim/jardim 3.jpg", icon:"fa-leaf"},
    {src:"images/SUITES/Imagens/Jardim/Jardim 5.jpg", icon:"fa-leaf"},
    {src:"images/SUITES/Imagens/Jardim/jardim 4.jpg", icon:"fa-leaf"}
  ],
  "brisa":[
    {src:"images/SUITES/Imagens/Brisa/brisa 1.webp", icon:"fa-wind"},
    {src:"images/SUITES/Imagens/Brisa/brisa 2.jpg", icon:"fa-wind"},
    {src:"images/SUITES/Imagens/Brisa/brisa 3.jpg", icon:"fa-wind"},
    {src:"images/SUITES/Imagens/Brisa/brisa 4.jpg", icon:"fa-wind"},
    {src:"images/SUITES/Imagens/Brisa/brisa 5.jpg", icon:"fa-wind"}
  ],
  "horizonte":[
    {src:"images/SUITES/Imagens/Horizonte/WhatsApp Image 2025-09-17 at 21.31.15.jpeg", icon:"fa-mountain"},
    {src:"images/SUITES/Imagens/Horizonte/WhatsApp Image 2025-09-17 at 21.31.32.jpeg", icon:"fa-mountain"},
    {src:"images/SUITES/Imagens/Horizonte/WhatsApp Image 2025-09-17 at 21.31.52.jpeg", icon:"fa-mountain"},
    {src:"images/SUITES/Imagens/Horizonte/WhatsApp Image 2025-09-17 at 21.32.38.jpeg", icon:"fa-mountain"},
    {src:"images/SUITES/Imagens/Horizonte/WhatsApp Image 2025-09-17 at 21.33.09.jpeg", icon:"fa-mountain"}
  ],
  "master-raizes":[
    {src:"images/SUITES/Imagens/Master raizes/Raizes 2.jpg", icon:"fa-tree"},
    {src:"images/SUITES/Imagens/Master raizes/Raizes.jpg", icon:"fa-tree"},
    {src:"images/SUITES/Imagens/Master raizes/Raizes 3.jpg", icon:"fa-tree"},
    {src:"images/SUITES/Imagens/Master raizes/Raizes 4.jpg", icon:"fa-tree"},
    {src:"images/SUITES/Imagens/Master raizes/Raizes 5.jpg", icon:"fa-tree"}
  ],
  "master-oceano":[
    {src:"images/SUITE MASTER/4E1A0327.jpg", icon:"fa-water"},
    {src:"images/SUITE MASTER/4E1A0408.jpg", icon:"fa-water"},
    {src:"images/SUITE MASTER/4E1A0429.jpg", icon:"fa-water"},
    {src:"images/SUITE MASTER/4E1A0490.jpg", icon:"fa-water"},
    {src:"images/SUITE MASTER/4E1A0472.jpg", icon:"fa-water"}
  ],
  "varanda-do-sol":[
    {src:"images/SUITES/Imagens/Varanda do sol/Varanda 1.jpg", icon:"fa-sun"},
    {src:"images/SUITES/Imagens/Varanda do sol/varanda 2.jpg", icon:"fa-sun"},
    {src:"images/SUITES/Imagens/Varanda do sol/varanda 3.jpg", icon:"fa-sun"},
    {src:"images/SUITES/Imagens/Varanda do sol/varanda 4.jpg", icon:"fa-sun"},
    {src:"images/SUITES/Imagens/Varanda do sol/varanda 5.jpg", icon:"fa-sun"}
  ]
};

/* ================== ELEMENTOS ================== */
const galeria   = document.getElementById("galeria");
const buttons   = document.querySelectorAll(".categoria-menu button");
const mainWrap  = document.getElementById("mainPicture");
const mainTitle = document.getElementById("mainTitle");
const lightbox  = document.getElementById("lightbox");
const lightboxImg = lightbox.querySelector("img");
const prevBtn   = document.getElementById("prev");
const nextBtn   = document.getElementById("next");

let currentCategory = "mare-alta";
let currentIndex = 0;
const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================== HELPERS ================== */
const enc = (p) => encodeURI(p);

/* monta um <picture> com AVIF/WebP + fallback JPG (com srcset responsivo) */
function buildPicture(src, {sizes, widths=[800,980,1400], eager=false, alt=""}={}){
  const s = enc(src);
  const avif = widths.map(w => `${s}?nf_resize=fit&w=${w}&fm=avif&q=65 ${w}w`).join(", ");
  const webp = widths.map(w => `${s}?nf_resize=fit&w=${w}&fm=webp&q=75 ${w}w`).join(", ");
  const jpg  = widths.map(w => `${s}?nf_resize=fit&w=${w}&q=75 ${w}w`).join(", ");

  const picture = document.createElement("picture");

  const avifEl = document.createElement("source");
  avifEl.type = "image/avif";
  avifEl.setAttribute("srcset", avif);
  picture.appendChild(avifEl);

  const webpEl = document.createElement("source");
  webpEl.type = "image/webp";
  webpEl.setAttribute("srcset", webp);
  picture.appendChild(webpEl);

  const img = document.createElement("img");
  img.setAttribute("src", `${s}?nf_resize=fit&w=${widths[widths.length-1]}&q=75`);
  img.setAttribute("srcset", jpg);
  if (sizes) img.setAttribute("sizes", sizes);
  img.alt = alt || "";
  img.decoding = "async";
  img.loading  = eager ? "eager" : "lazy";
  if (eager) img.fetchPriority = "high";
  picture.appendChild(img);

  return {picture, img};
}

function setArrowsEnabled(enabled){
  prevBtn.disabled = !enabled;
  nextBtn.disabled = !enabled;
}

/* cria/atualiza as miniaturas */
function criarGaleria(cat){
  galeria.innerHTML = "";
  const lista = (cat === "todas")
    ? Object.keys(suites).flatMap(k => suites[k].map(i => ({...i, categoria:k})))
    : suites[cat].map(i => ({...i, categoria:cat}));

  const frag = document.createDocumentFragment();

  lista.forEach((item, index) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "item";
    btn.setAttribute("aria-label", `Abrir ${item.categoria.replace(/-/g," ")}`);

    const {picture} = buildPicture(item.src, {
      sizes:"(max-width:640px) 45vw, (max-width:900px) 30vw, 220px",
      widths:[280,360,480],
      eager:false,
      alt:`Suíte ${item.categoria}`
    });

    const p = document.createElement("p");
    p.innerHTML = `<i class="fa-solid ${item.icon}" aria-hidden="true"></i> ${item.categoria.replace(/-/g," ").toUpperCase()}`;

    btn.appendChild(picture);
    btn.appendChild(p);

    btn.addEventListener("click", () => {
      setMainImage(item.src, item.icon, item.categoria, {eager:false});
      currentIndex = index;
    });

    frag.appendChild(btn);
  });

  galeria.appendChild(frag);
}

/* coloca picture na principal + prefetch do próximo */
function setMainImage(src, icon, categoria, {eager=false}={}){
  mainWrap.innerHTML = "";
  const {picture, img} = buildPicture(src, {
    sizes:"(max-width: 980px) 100vw, 980px",
    widths:[800,980,1400],
    eager,
    alt:`Imagem principal da suíte ${categoria.replace(/-/g," ")}`
  });

  img.addEventListener("load", ()=> img.classList.add("loaded"), {once:true});
  mainWrap.appendChild(picture);

  mainTitle.innerHTML = `<i class="fa-solid ${icon}" aria-hidden="true"></i> ${categoria.replace(/-/g," ").toUpperCase()}`;

  img.addEventListener("click", ()=>{
    lightboxImg.src = img.currentSrc || img.src;
    lightbox.classList.add("open");
  });

  if (currentCategory !== "todas"){
    const nextIdx = (currentIndex + 1) % suites[currentCategory].length;
    const nextItem = suites[currentCategory][nextIdx];
    if (nextItem){
      const l = document.createElement("link");
      l.rel = "preload";
      l.as  = "image";
      l.href = enc(nextItem.src) + "?nf_resize=fit&w=980&q=75";
      document.head.appendChild(l);
    }
  }
}

/* init */
function init(){
  criarGaleria(currentCategory);
  const first = suites[currentCategory][0];
  if (first) {
    setMainImage(first.src, first.icon, currentCategory, {eager:true});
    setArrowsEnabled(true);
  }
}
init();

/* filtros */
buttons.forEach(btn=>{
  btn.addEventListener("click", ()=>{
    buttons.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentCategory = btn.getAttribute("data-cat");
    currentIndex = 0;

    criarGaleria(currentCategory);

    if(currentCategory !== "todas"){
      const first = suites[currentCategory][0];
      if (first) setMainImage(first.src, first.icon, currentCategory, {eager:false});
      setArrowsEnabled(true);
    } else {
      setArrowsEnabled(false);
    }

    document.getElementById('galeria').scrollIntoView({behavior: reducedMotion ? 'auto' : 'smooth', block:'start'});
  });
});

/* navegação por setas (desligadas em "todas") */
function goPrev(){
  if(currentCategory==="todas") return;
  currentIndex = (currentIndex - 1 + suites[currentCategory].length) % suites[currentCategory].length;
  const it = suites[currentCategory][currentIndex];
  setMainImage(it.src, it.icon, currentCategory);
}
function goNext(){
  if(currentCategory==="todas") return;
  currentIndex = (currentIndex + 1) % suites[currentCategory].length;
  const it = suites[currentCategory][currentIndex];
  setMainImage(it.src, it.icon, currentCategory);
}
prevBtn.addEventListener("click", goPrev);
nextBtn.addEventListener("click", goNext);

/* teclado (setas e ESC no lightbox) */
window.addEventListener("keydown",(e)=>{
  if(lightbox.classList.contains("open")){
    if(e.key === "Escape"){ lightbox.classList.remove("open"); }
    if(e.key === "ArrowRight"){ goNext(); lightboxImg.src = document.querySelector('#mainPicture img')?.currentSrc || lightboxImg.src; }
    if(e.key === "ArrowLeft"){  goPrev();  lightboxImg.src = document.querySelector('#mainPicture img')?.currentSrc || lightboxImg.src; }
    return;
  }
  if(e.key === "ArrowRight"){ goNext(); }
  if(e.key === "ArrowLeft"){  goPrev(); }
});

/* swipe em mobile na imagem principal */
let startX = 0, swiping = false;
mainWrap.addEventListener("touchstart", (e)=>{ startX = e.touches[0].clientX; swiping = true; }, {passive:true});
mainWrap.addEventListener("touchmove", (e)=>{
  if(!swiping) return;
  const dx = e.touches[0].clientX - startX;
  if(Math.abs(dx) > 50){
    swiping = false;
    dx < 0 ? goNext() : goPrev();
  }
},{passive:true});
mainWrap.addEventListener("touchend", ()=>{ swiping = false; });

/* lightbox fecha ao clicar no fundo */
lightbox.addEventListener("click", ()=> lightbox.classList.remove("open"));
</script>
</body>
</html>
